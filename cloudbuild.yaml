steps:
  # Step to install modelscan and scan the model file before building the image
  - name: 'python:3.8-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Installing modelscan..."
        pip install modelscan
        echo "Scanning models/model.pkl..."
        # Check if model.pkl exists in the models/ directory
        if [ ! -f "models/model.pkl" ]; then
          echo "models/model.pkl does not exist."
          exit 1
        fi
        # Run the scan command on models/model.pkl
        scan_output=$(modelscan -p models/model.pkl)
        echo "$scan_output"
        # Check if the output contains the line "No issues found! 🎉"
        if ! echo "$scan_output" | grep -q "No issues found! 🎉"; then
          echo "Model scan failed with issues for models/model.pkl."
          exit 1
        fi
    id: 'scan-model'
    waitFor: ['-']

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/my-model-service:$SHORT_SHA', '.']
    id: 'build-image'
    waitFor: ['scan-model']

  # Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/my-model-service:$SHORT_SHA']
    id: 'push-image'
    waitFor: ['build-image']

  # Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['run', 'deploy', 'my-model-service', '--image', 'gcr.io/$PROJECT_ID/my-model-service:$SHORT_SHA', '--region', 'us-central1', '--platform', 'managed']
    id: 'deploy-service'
    waitFor: ['push-image']
images:
  - 'gcr.io/$PROJECT_ID/my-model-service:$SHORT_SHA'

